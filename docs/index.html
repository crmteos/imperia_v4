<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIA v4: Master Sovereign UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.0/tailwind.min.css" />
    <style>
        body { margin: 0; padding: 20px; background: #0d0f12; color: #e0e6ed; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2f3a; padding-bottom: 15px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: bold; color: #00ffcc; }
        .badge { background: #1a2332; border: 1px solid #00ffcc; color: #00ffcc; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .map-container { margin-bottom: 20px; }
        #map { height: 480px; border-radius: 8px; border: 1px solid #2a2f3a; background: #000; width: 100%; }
        .bottom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: #141820; border: 1px solid #2a2f3a; border-radius: 8px; padding: 15px; }
        .card h3 { margin-top: 0; color: #8899a6; font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #2a2f3a; padding-bottom: 8px; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1c212c; }
        .btn { display: inline-block; background: #00ffcc; color: #000; font-weight: bold; padding: 10px 16px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn:hover { background: #00cca3; }
        .btn-danger { background: #ff3366; color: #fff; }
        .btn-danger:hover { background: #cc0033; }
        .p2p-card { background: #1c212c; padding: 8px 12px; border-radius: 4px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; }
        @media (max-width: 900px) { .bottom-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="header">
        <div>
            <div class="title">IMPERIA v4: Master Sovereign UI</div>
            <div style="font-size: 12px; color: #8899a6;">Brahman Orchestration Node</div>
        </div>
        <div>
            <span class="badge">Cohort Q: <span id="cohort-q">0.94</span></span>
            <a href="kassator.html" class="btn" style="margin-left: 10px;">Launch Kassator Terminal &rarr;</a>
        </div>
    </div>

    <!-- Top Section: Full Width Map Block -->
    <div class="map-container">
        <div class="card">
            <h3>H3 Grid Geospatial Overlay (Ukraine)</h3>
            <div id="map"></div>
        </div>
    </div>

    <!-- Bottom Section: 3-Column Grid below Map -->
    <div class="bottom-grid">
        <div class="card">
            <h3>System Telemetry</h3>
            <div class="stat-row"><span>System Load:</span><strong id="system-load">24%</strong></div>
            <div class="stat-row"><span>Online Nodes:</span><strong id="nodes-online">5 / 6</strong></div>
            <div class="stat-row"><span>Avg Response:</span><strong id="avg-response">42ms</strong></div>
        </div>

        <div class="card">
            <h3>Master Override</h3>
            <button class="btn btn-danger" onclick="masterOverride.pauseTenant()" style="width: 100%; margin-bottom: 10px;">Pause Tenant Session</button>
            <button class="btn" onclick="masterOverride.recalibrateQ()" style="width: 100%;">Recalibrate Q-Bounds</button>
        </div>

        <div class="card">
            <h3>P2P Mesh Nodes</h3>
            <div id="p2p-nodes-list">Loading nodes...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const FALLBACK_STATE = {
            system_telemetry: { q_cohort: "0.94", load: "24%", nodes_online: "5 / 6", avg_latency: "42ms" },
            p2p_nodes: [
                { id: "101", hub: "Kyiv (101)", qFactor: 0.92, coordinates: [50.4501, 30.5234] },
                { id: "102", hub: "Lviv (102)", qFactor: 0.88, coordinates: [49.8383, 24.0232] },
                { id: "103", hub: "Odesa (103)", qFactor: 0.74, coordinates: [46.4825, 30.7233] },
                { id: "104", hub: "Kharkiv (104)", qFactor: 0.68, coordinates: [49.9935, 36.2304] },
                { id: "105", hub: "Dnipro (105)", qFactor: 0.81, coordinates: [48.4647, 35.0462] }
            ]
        };

        var map = null;

        function loadData() {
            fetch("./state_gateway.json")
                .then(function(r) { return r.json(); })
                .then(function(data) { renderUI(data); })
                .catch(function() { renderUI(FALLBACK_STATE); });
        }

        function renderUI(data) {
            if (!data) data = FALLBACK_STATE;
            var sys = data.system_telemetry || {};
            
            if (document.getElementById("cohort-q")) document.getElementById("cohort-q").textContent = sys.q_cohort || "0.94";
            if (document.getElementById("system-load")) document.getElementById("system-load").textContent = sys.load || "24%";
            if (document.getElementById("nodes-online")) document.getElementById("nodes-online").textContent = sys.nodes_online || "5 / 6";
            if (document.getElementById("avg-response")) document.getElementById("avg-response").textContent = sys.avg_latency || "42ms";

            renderNodes(data.p2p_nodes || []);
            renderMap(data.p2p_nodes || []);
        }

        function renderNodes(nodes) {
            var container = document.getElementById("p2p-nodes-list");
            if (!container) return;
            var list = Array.isArray(nodes) && nodes.length > 0 ? nodes : FALLBACK_STATE.p2p_nodes;
            var html = "";
            for (var i = 0; i < list.length; i++) {
                var n = list[i];
                html += '<div class="p2p-card"><span><strong>' + n.hub + '</strong></span><span>Q: ' + n.qFactor + '</span></div>';
            }
            container.innerHTML = html;
        }

        function renderMap(nodes) {
            if (typeof L === "undefined" || !document.getElementById("map")) return;
            if (map) map.remove();
            map = L.map("map").setView([48.3794, 31.1656], 6);
            
            // Esri Dark Gray Canvas — стабільно працює через file:// без 403 та без API-ключів
            L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Canvas/MapServer/tile/{z}/{y}/{x}", { 
                maxZoom: 16,
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
            }).addTo(map);

            var list = Array.isArray(nodes) && nodes.length > 0 ? nodes : FALLBACK_STATE.p2p_nodes;
            for (var i = 0; i < list.length; i++) {
                var n = list[i];
                var color = n.qFactor >= 0.9 ? "#00ffcc" : (n.qFactor >= 0.75 ? "#ffcc00" : "#ff3366");
                var circle = L.circleMarker(n.coordinates, { radius: 8, color: color, fillColor: color, fillOpacity: 0.8 }).addTo(map);
                circle.bindPopup("<strong>" + n.hub + "</strong><br>Q-Factor: " + n.qFactor);
            }
        }

        window.masterOverride = {
            pauseTenant: function() { alert("Master Override: Tenant session paused."); },
            recalibrateQ: function() { alert("Master Override: Q-Bounds recalibrated."); }
        };

        document.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>
