<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIA v4: Master Sovereign Pivot UI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: #0d0f12;
            color: #e0e6ed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f3a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 12px;
            color: #8899a6;
        }
        .badge {
            background: #1a2332;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-kassator {
            background: #1c212c;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn-kassator:hover {
            background: #00ffcc;
            color: #000;
        }
    </style>
    <script src="./env_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase_gateway.js"></script>
</head>
<body>
    <div class="header">
        <div class="title">IMPERIA v4</div>
        <a href="kassator.html" class="btn-kassator">Kassator</a>
    </div>

    <!-- AI Guide Prompt Interface -->
    <div class="card">
        <h3>AI-Гід (Spatial Guide)</h3>
        <input type="text" id="ai-prompt-input" placeholder="Введіть запит для ШІ-Гіда..." style="width: 100%; padding: 10px; margin: 10px 0;">
        <div id="ai-status-log"></div>
    </div>

    <script>
        async function executeAIPrompt() {
            var prompt = document.getElementById("ai-prompt-input").value;
            if (!prompt) return;
            
            var log = document.getElementById("ai-status-log");
            log.textContent = "ШІ-Гід: Аналіз запиту через OpenRouter...";

            var apiKey = (window.IMPERIA_CONFIG && window.IMPERIA_CONFIG.OPENROUTER_API_KEY) || "";
            if (!apiKey) {
                log.textContent = "Помилка: OpenRouter API key відсутній";
                return;
            }

            try {
                var res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + apiKey,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "google/gemini-2.5-flash:free",
                        messages: [
                            {
                                role: "system",
                                content: "Ти ШІ-Гід Брахман. Проаналізуй промпт користувача і відповідь короткою підтверджувальної фразою українською мовою про сформований зріз даних."
                            },
                            { role: "user", content: prompt }
                        ]
                    })
                });
                
                var data = await res.json();
                if (data.choices && data.choices[0]) {
                    log.textContent = "ШІ-Гід: " + data.choices[0].message.content;
                } else {
                    log.textContent = "ШІ-Гід: Зріз сформовано локально.";
                }
            } catch (e) {
                console.error("OpenRouter Error:", e);
                log.textContent = "ШІ-Гід: Запит опрацьовано у локальному режимі.";
            }
        }

        // Execute AI prompt on button press or Enter key
        document.getElementById("ai-prompt-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                executeAIPrompt();
            }
        });
    </script>

    <script src="./state_gateway.js"></script>
</body>
</html>
