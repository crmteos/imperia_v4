<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIA v4 — H3 Map Core</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map { height: 100%; width: 100%; }
        body { background: #0d0f12; color: #e0e6ed; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
        #map { z-index: 0; }
        .leaflet-container { background: #0d0f12; }
        .info-panel {
            position: absolute; top: 12px; left: 12px; z-index: 1000;
            background: rgba(18, 23, 33, 0.92); border: 1px solid #2a2f3a;
            border-radius: 8px; padding: 12px; font-size: 13px;
            pointer-events: auto; backdrop-filter: blur(6px);
            min-width: 260px;
        }
        .info-panel .title { font-weight: bold; color: #00ffcc; margin-bottom: 8px; font-size: 14px; }
        .info-panel .line { margin: 4px 0; color: #c9d2dc; }
        .info-panel .line b { color: #e0e6ed; }
        .controls { position: absolute; bottom: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; }
        .btn {
            background: #1c212c; border: 1px solid #00ffcc; color: #00ffcc;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
            font-family: inherit;
        }
        .btn:hover { background: #00ffcc; color: #000; }
        .btn:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="info-panel">
        <div class="title">IMPERIA v4 — H3 Map Core</div>
        <div class="line" id="info-text">Ініціалізація Leaflet + H3…</div>
        <div class="line">Карта: OpenStreetMap</div>
        <div class="line">Режим: автономна ініціалізація</div>
        <div class="line" id="h3-stats">H3 гексагони: —</div>
    </div>

    <div class="controls">
        <button class="btn" id="btn-reset">Скинути вигляд</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/h3-js@3.7.2/dist/h3-js.min.js"></script>
    <script>
        (function initMap() {
            var center = [50.4501, 30.5234]; // Київ

            var map = L.map('map', {
                center: center,
                zoom: 8,
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // H3 гексагони навколо Києва (резолюція 8, кільце радіусом 2)
            var centerH3 = h3.geoToH3(center[0], center[1], 8);
            var ring = h3.gridRing(centerH3, 2);

            ring.forEach(function (h) {
                var boundary = h3.h3ToGeoBoundary(h);
                var latlngs = boundary.map(function (p) { return [p[0], p[1]]; });
                L.polygon(latlngs, {
                    color: '#3a4255',
                    weight: 1,
                    fillColor: '#121721',
                    fillOpacity: 0.55,
                    stroke: true
                }).addTo(map).bindTooltip(h, { direction: 'center', opacity: 0.9, sticky: true });
            });

            document.getElementById('info-text').textContent = 'Карта активна — Kyiv, Україна';
            document.getElementById('h3-stats').textContent = 'H3 гексагони (res 8): ' + ring.length + ' шт. | h3-js v3.7.2';

            // Перерахунок сітки при зміні розміра вікна
            function onResize() { map.invalidateSize(); }
            window.addEventListener('resize', onResize);
            map.on('resize', onResize);

            document.getElementById('btn-reset').addEventListener('click', function () {
                map.setView(center, 8);
            });
        })();
    </script>
</body>
</html>
