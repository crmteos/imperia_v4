<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIA v4 — H3 Map Core</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body, #map { height: 100%; width: 100%; }
        body { background: #0d0f12; color: #e0e6ed; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
        #map { z-index: 0; }
        .leaflet-container { background: #0d0f12; }
        .btn {
            background: #1c212c; border: 1px solid #00ffcc; color: #00ffcc;
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
            font-family: inherit;
        }
        .btn:hover { background: #00ffcc; color: #000; }
        .btn:active { transform: translateY(1px); }
    </style>
</head>
<body>
    <div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/h3-js@3.7.2/dist/h3-js.min.js"></script>
    <script>
        (function initMap() {
            var center = [50.4501, 30.5234]; // Київ

            var map = L.map('map', {
                center: center,
                zoom: 8,
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            L.control.zoom({ position: 'topleft' }).addTo(map);

            // H3 гексагони навколо Києва (резолюція 8, кільце радіусом 2)
            var centerH3 = h3.geoToH3(center[0], center[1], 8);
            var ring = h3.gridRing(centerH3, 2);

            ring.forEach(function (h) {
                var boundary = h3.h3ToGeoBoundary(h);
                var latlngs = boundary.map(function (p) { return [p[0], p[1]]; });
                L.polygon(latlngs, {
                    color: '#3a4255',
                    weight: 1,
                    fillColor: '#121721',
                    fillOpacity: 0.55,
                    stroke: true
                }).addTo(map).bindTooltip(h, { direction: 'center', opacity: 0.9, sticky: true });
            });

            document.getElementById('info-text').textContent = 'Карта активна — Kyiv, Україна';
            document.getElementById('h3-stats').textContent = 'H3 гексагони (res 8): ' + ring.length + ' шт. | h3-js v3.7.2';

            // Перерахунок сітки при зміні розміра вікна
            function onResize() { map.invalidateSize(); }
            window.addEventListener('resize', onResize);
            map.on('resize', onResize);

            document.getElementById('btn-reset').addEventListener('click', function () {
                map.setView(center, 8);
            });
        })();
    </script>
</body>
</html>
