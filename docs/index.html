<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPERIA v4: Sovereign Core Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <style>
    :root { --bg: #0a0a0f; --border: #2a2a3a; --tanunah: #ffd700; }
    body { background-color: var(--bg); color: #e8e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .leaflet-container img { max-width: none !important; max-height: none !important; }
    #map { width: 100% !important; height: 550px !important; border-radius: 12px; border: 1px solid var(--border); display: block; position: relative; z-index: 1; }
  </style>
</head>
<body class="p-4 md:p-6 max-w-7xl mx-auto space-y-6">
  <header class="bg-gray-900/90 border border-gray-800 rounded-2xl p-4 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-4 h-4 rounded-full bg-yellow-400 animate-pulse"></div>
      <div>
        <h1 class="text-xl font-extrabold text-white">IMPERIA v4: Sovereign Core Admin</h1>
        <p class="text-xs text-yellow-400 font-medium">Brahman-orchestrated Node | Q = 0.94</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex flex-col text-xs">
        <label class="text-gray-400">Країна:</label>
        <select id="filter-country" class="bg-gray-800 text-white border border-gray-700 rounded-lg px-2 py-1 text-xs">
          <option value="ua">🇺🇦 Україна</option>
          <option value="jp">🇯🇵 Японія</option>
          <option value="eu">🇪🇺 Європейський Союз</option>
        </select>
      </div>
      <div class="flex flex-col text-xs">
        <label class="text-gray-400">Регіон / Хаб:</label>
        <select id="filter-region" class="bg-gray-800 text-white border border-gray-700 rounded-lg px-2 py-1 text-xs">
          <option value="all">Усі 5 Хабів</option>
          <option value="101">Kyiv Central (101)</option>
          <option value="102">Lviv West (102)</option>
          <option value="103">Odesa South (103)</option>
          <option value="104">Kharkiv East (104)</option>
          <option value="105">Dnipro Center (105)</option>
        </select>
      </div>
      <div class="flex flex-col text-xs">
        <label class="text-gray-400">Модуль:</label>
        <select id="filter-module" class="bg-gray-800 text-white border border-gray-700 rounded-lg px-2 py-1 text-xs">
          <option value="map">🗺️ H3 Гео-Карта</option>
          <option value="telemetry">📊 Метрики Ядра</option>
        </select>
      </div>
    </div>
  </header>
</body>
</html>
