<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIA v4: Master Sovereign Pivot UI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: #0d0f12;
            color: #e0e6ed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2f3a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 12px;
            color: #8899a6;
        }
        .badge {
            background: #1a2332;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-kassator {
            background: #1c212c;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn-kassator:hover {
            background: #00ffcc;
            color: #000;
        }

        /* Brahman Vault Inspector widget */
        .vault-inspector {
            border: 1px solid #2a2f3a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            background: #121721;
        }
        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .vault-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffb300;
        }
        .status-online { background: #00ffcc; box-shadow: 0 0 6px #00ffcc; }
        .status-offline { background: #ff4444; box-shadow: 0 0 6px #ff4444; }
        .status-standby { background: #ffb300; box-shadow: 0 0 6px #ffb300; }
        .vault-filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .vault-filter-btn {
            background: #1c212c;
            border: 1px solid #3a4255;
            color: #e0e6ed;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .vault-filter-btn.active {
            border-color: #00ffcc;
            color: #00ffcc;
        }
        .vault-filter-btn:hover { border-color: #00ffcc; }
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }
        .vault-card {
            background: #1c212c;
            border: 1px solid #2a2f3a;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .vault-card .meta {
            font-size: 11px;
            color: #8899a6;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .vault-card .invariant {
            font-size: 14px;
            color: #e0e6ed;
            margin: 4px 0;
        }
        .q-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            text-align: center;
            width: 40px;
        }
        .q-badge.high { background: #00221a; color: #00ffcc; border: 1px solid #00ffcc; }
        .q-badge.med { background: #2a2200; color: #ffb300; border: 1px solid #ffb300; }
        .vault-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .vault-tag {
            background: #1a2332;
            border: 1px solid #3a4255;
            color: #aabbcc;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .vault-empty {
            text-align: center;
            color: #8899a6;
            padding: 20px;
            font-style: italic;
        }
        .vault-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }
        .vault-actions button {
            background: #1c212c;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .vault-actions button:hover { background: #00ffcc; color: #000; }
    </style>
    <script src="./env_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase_gateway.js"></script>
    <script src="./supabase_vault_client.js"></script>
</head>
<body>
    <div class="header">
        <div class="title">IMPERIA v4</div>
        <a href="kassator.html" class="btn-kassator">Kassator</a>
    </div>

    <!-- AI Guide Prompt Interface -->
    <div class="card">
        <h3>AI-Гід (Spatial Guide)</h3>
        <input type="text" id="ai-prompt-input" placeholder="Введіть запит для ШІ-Гіда..." style="width: 100%; padding: 10px; margin: 10px 0;">
        <div id="ai-status-log"></div>
    </div>

    <!-- Brahman Vault Inspector -->
    <div class="card vault-inspector">
        <div class="vault-header">
            <h3>Brahman Vault Inspector</h3>
            <div class="vault-status" id="vault-status-indicator">
                <span class="status-dot status-standby" id="vault-status-dot"></span>
                <span id="vault-status-text">Standby</span>
            </div>
        </div>
        <div class="vault-controls">
            <div class="vault-actions">
                <button id="vault-refresh-btn">Оновити інваріанти</button>
            </div>
            <div class="vault-filters" id="vault-filters">
                <button class="vault-filter-btn active" data-octave="all">All</button>
                <button class="vault-filter-btn" data-octave="M0">M0</button>
                <button class="vault-filter-btn" data-octave="M1">M1</button>
                <button class="vault-filter-btn" data-octave="M2">M2</button>
                <button class="vault-filter-btn" data-octave="M3">M3</button>
                <button class="vault-filter-btn" data-octave="M4">M4</button>
                <button class="vault-filter-btn" data-octave="M5">M5</button>
                <button class="vault-filter-btn" data-octave="M6">M6</button>
            </div>
        </div>
        <div class="vault-grid" id="vault-grid">
            <div class="vault-empty">Очікування зв'язку із Supabase Vault...</div>
        </div>
    </div>

    <script>
        async function executeAIPrompt() {
    var prompt = document.getElementById("ai-prompt-input").value;
    if (!prompt) return;
    
    var log = document.getElementById("ai-status-log");
    log.textContent = "ШІ-Гід: Аналіз запиту через OpenRouter...";

    var apiKey = (window.IMPERIA_CONFIG && window.IMPERIA_CONFIG.OPENROUTER_API_KEY) || "";
    if (!apiKey) {
        log.textContent = "Помилка: OpenRouter API key відсутній";
        return;
    }

    try {
        var res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + apiKey,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "google/gemini-2.5-flash:free",
                messages: [
                    {
                        role: "system",
                        content: "Ти — ШІ-Гід Брахман (Brahman AI Spatial Analyst) системи IMPERIA v4. Твоє завдання — пояснювати Власнику сутність системи, 4D-векторів E=[Lang,Geo,Hist,Soc], H3-картки та дашборду, або формувати зрізи даних за його запитом. Відповідай дружньо, мудро, лаконічно та зрозуміло українською мовою."
                    },
                    { role: "user", content: prompt }
                ]
            })
        });
        
        var data = await res.json();
        if (data.choices && data.choices[0] && data.choices[0].message) {
            log.style.color = "#00ffcc";
            log.innerHTML = "<strong>ШІ-Гід:</strong> " + data.choices[0].message.content;
        } else {
            log.textContent = "ШІ-Гід: Зріз опрацьовано локально.";
        }
    } catch (e) {
        console.error("OpenRouter Error:", e);
        log.textContent = "ШІ-Гід: Помилка з'єднання, запит оброблено локально.";
    }
}

        // Execute AI prompt on button press or Enter key
        document.getElementById("ai-prompt-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                executeAIPrompt();
            }
        });
    </script>

    <script>
        // Brahman Vault Inspector logic
        (function initVaultInspector() {
            const cfg = window.IMPERIA_CONFIG || {};
            const supabaseUrl = cfg.SUPABASE_URL || "";
            const supabaseKey = cfg.SUPABASE_ANON_KEY || "";

            const statusDot = document.getElementById("vault-status-dot");
            const statusText = document.getElementById("vault-status-text");
            const grid = document.getElementById("vault-grid");
            const refreshBtn = document.getElementById("vault-refresh-btn");
            const filters = document.getElementById("vault-filters");

            let client = null;
            if (supabaseUrl && supabaseKey && typeof BrahmanVaultClient !== "undefined") {
                client = new BrahmanVaultClient(supabaseUrl, supabaseKey);
            }

            function setStatus(state) {
                statusDot.className = "status-dot status-" + state;
                statusText.textContent = state.charAt(0).toUpperCase() + state.slice(1);
            }

            function qBadge(score) {
                const high = score >= 0.90;
                return '<span class="q-badge ' + (high ? "high" : "med") + '">Q ' + (score * 100).toFixed(0) + '</span>';
            }

            async function loadInvariants(octave) {
                if (!supabaseUrl || !supabaseKey) {
                    grid.innerHTML = '<div class="vault-empty">Supabase не сконфігурований у env_config.js</div>';
                    setStatus("offline");
                    return;
                }
                setStatus("standby");
                try {
                    let url = supabaseUrl + "/rest/v1/brahman_knowledge_vault?select=*&order=q_coherence_score.desc";
                    if (octave && octave !== "all") {
                        url += "&m_octave=eq." + octave;
                    }
                    const res = await fetch(url, {
                        headers: {
                            apikey: supabaseKey,
                            Authorization: "Bearer " + supabaseKey
                        }
                    });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const data = await res.json() || [];
                    setStatus("online");
                    renderInvariants(data);
                } catch (e) {
                    console.error("Vault Inspector error:", e);
                    grid.innerHTML = '<div class="vault-empty">Помилка з\'єднання із Supabase Vault</div>';
                    setStatus("offline");
                }
            }

            function renderInvariants(data) {
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="vault-empty">Інваріанти не знайдено</div>';
                    return;
                }
                grid.innerHTML = data.map(function(item) {
                    var tags = (item.tags || []).map(function(t) {
                        return '<span class="vault-tag">' + t + '</span>';
                    }).join("");
                    return '<div class="vault-card">' +
                        '<div class="meta">' +
                        '<span><strong>Октава:</strong> ' + (item.m_octave || "—") + '</span>' +
                        '<span><strong>Категорія:</strong> ' + (item.domain_category || "—") + '</span>' +
                        qBadge(item.q_coherence_score || 0) +
                        '</div>' +
                        '<div class="invariant">' + (item.distilled_invariant || "—") + '</div>' +
                        '<div class="meta"><strong>Сигнал:</strong> ' + (item.raw_signal || "—") + '</div>' +
                        '<div class="vault-tags">' + tags + '</div>' +
                        '</div>';
                }).join("");
            }

            refreshBtn.addEventListener("click", function() {
                var active = filters.querySelector(".vault-filter-btn.active");
                loadInvariants(active ? active.dataset.octave : "all");
            });

            filters.addEventListener("click", function(e) {
                if (e.target.classList.contains("vault-filter-btn")) {
                    filters.querySelectorAll(".vault-filter-btn").forEach(function(b) { b.classList.remove("active"); });
                    e.target.classList.add("active");
                    loadInvariants(e.target.dataset.octave);
                }
            });

            loadInvariants();
        })();
    </script>

    <script src="./state_gateway.js"></script>
</body>
</html>
